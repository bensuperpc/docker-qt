name: qt-docker-images

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  qt-docker-images:
    name: qt:${{ matrix.images.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        images:
        - image: debian
          version: 12
        - image: debian
          version: 13
        - image: ubuntu
          version: 24.04
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4.2.1
        with:
#          submodules: 'recursive'
          fetch-depth: 1
      - name: clean the image
        run: make ${{ matrix.images.image }}.${{ matrix.version }}.clean
      - name: Build
        run: make ${{ matrix.images.image }}.${{ matrix.version }}.build
      - name: Test the image
        run: CPUS=2.0 make ${{ matrix.images.image }}.${{ matrix.version }}.test
#      - name: "Push to hub.docker.com"
#        if: github.ref == 'refs/heads/main'
#        run: |
#            echo ${{ secrets.DOCKER_PASS }} | docker login --username ${{ secrets.DOCKER_USER }} --password-stdin
#            make ${{ matrix.images.image }}.push
